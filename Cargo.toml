[package]
name = "phoebis-proxy"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
# tokio's stream sets no TCP keepalive, so the tunnel sets it on both sockets through socket2.
socket2 = "0.6"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["sync"] }
