name: Documentation
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  site:
    uses: phoebis-project/phoebis-docs/.github/workflows/build.yml@main
    with:
      product: proxy
      ref: ${{ github.sha }}
    secrets:
      DOCS_APP_PRIVATE_KEY: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
  start-deploy:
    # The site deploys from phoebis-docs alone. A push to main here starts that workflow, which builds from the four
    # main heads. In a fork the job is skipped, so a fork's own main starts no deploy.
    if: github.event_name == 'push' && github.repository_owner == 'phoebis-project'
    needs: site
    # The start key is a secret of this environment, whose branch rule allows main alone, so a workflow on another
    # branch gets no key. The job deploys nothing in this repository, so it records no deployment.
    environment:
      deployment: false
      name: docs-deploy
    runs-on: ubuntu-24.04
    env:
      # A step's condition cannot read a secret, so the job states once for each half of the start credential
      # whether it is set.
      CLIENT_ID_SET: ${{ vars.DOCS_DEPLOY_APP_CLIENT_ID != '' }}
      PRIVATE_KEY_SET: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY != '' }}
    steps:
      # The token step would fail on a missing half with the action's own error. The line says for each half whether it
      # is set and prints no value.
      - if: env.CLIENT_ID_SET != 'true' || env.PRIVATE_KEY_SET != 'true'
        run: |
          echo "::error::No deploy started. Variable DOCS_DEPLOY_APP_CLIENT_ID set: $CLIENT_ID_SET." \
            "Secret DOCS_DEPLOY_APP_PRIVATE_KEY set: $PRIVATE_KEY_SET."
          exit 1
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_DEPLOY_APP_CLIENT_ID }}
          owner: phoebis-project
          permission-actions: write
          private-key: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY }}
          repositories: phoebis-docs
      - run: gh workflow run deploy.yml --repo phoebis-project/phoebis-docs --ref main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
